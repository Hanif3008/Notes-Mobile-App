<!-- BEGIN: Interactive Switcher Logic -->
<script data-purpose="auth-toggle-logic">
    // Current state track: 'signin' | 'register'
    let currentMode = 'signin';

    function setAuthMode(mode) {
      currentMode = mode;
      
      const signInForm = document.getElementById('signInForm');
      const registerForm = document.getElementById('registerForm');
      const headerTitle = document.getElementById('headerHeroTitle');
      const formHeading = document.getElementById('formHeadingTitle');
      const topNavBtn = document.getElementById('topNavToggleBtn');
      const bottomContainer = document.getElementById('bottomToggleContainer');
      const tabSignIn = document.getElementById('tabSignInBtn');
      const tabRegister = document.getElementById('tabRegisterBtn');

      if (mode === 'signin') {
        // Toggle forms visibility
        signInForm.classList.remove('hidden');
        registerForm.classList.add('hidden');

        // Header Title
        headerTitle.innerHTML = 'Sign in to<br>Continue';
        formHeading.textContent = 'Sign in';
        topNavBtn.textContent = 'Sign up';

        // Update Bottom helper text
        bottomContainer.innerHTML = 'Don’t have an account? <button type="button" onclick="setAuthMode(\'register\')" class="text-[#329eaf] font-semibold hover:underline ml-1">Sign up</button>';

        // Tab Pill styles
        tabSignIn.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all duration-200 bg-white text-slate-800 shadow-sm";
        tabSignIn.setAttribute('aria-selected', 'true');
        tabRegister.className = "flex-1 py-2 text-xs font-medium rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900";
        tabRegister.setAttribute('aria-selected', 'false');

      } else {
        // Toggle forms visibility
        signInForm.classList.add('hidden');
        registerForm.classList.remove('hidden');

        // Header Title
        headerTitle.innerHTML = 'Create your<br>account';
        formHeading.textContent = 'Register';
        topNavBtn.textContent = 'Sign in';

        // Update Bottom helper text
        bottomContainer.innerHTML = 'Already have an account? <button type="button" onclick="setAuthMode(\'signin\')" class="text-[#329eaf] font-semibold hover:underline ml-1">Register</button>';

        // Tab Pill styles
        tabSignIn.className = "flex-1 py-2 text-xs font-medium rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900";
        tabSignIn.setAttribute('aria-selected', 'false');
        tabRegister.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all duration-200 bg-white text-slate-800 shadow-sm";
        tabRegister.setAttribute('aria-selected', 'true');
      }
    }

    function toggleAuthMode() {
      if (currentMode === 'signin') {
        setAuthMode('register');
      } else {
        setAuthMode('signin');
      }
    }

    // Toggle Password Visibility helper
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        // Eye-slash / hidden icon
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
      } else {
        input.type = 'password';
        // Standard Eye icon
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
      }
    }
  </script>
<!-- END: Interactive Switcher Logic -->
